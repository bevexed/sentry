# Relay 配置
relay:
  # 以 managed 模式运行，从上游 Sentry 获取项目配置
  mode: managed
  upstream: "http://nginx:9000/"
  host: 0.0.0.0
  port: 3000

logging:
  level: info

processing:
  enabled: true
  kafka_config:
    - name: "bootstrap.servers"
      value: "kafka:9092"
  redis: "redis://redis:6379"
  # 限制内存使用，防止 OOM
  max_envelope_size: 10485760  # 10MB
  max_message_size: 10485760  # 10MB
  # 限制并发连接数
  max_concurrent_requests: 1000
